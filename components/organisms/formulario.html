<!-- ORGANISMO · Formulario (la validación la hace el navegador con required, pattern y type) -->

  <div class="organismo-formulario__rejilla">
    <div class="molecula-campo-completo"><label class="atomo-etiqueta atomo-etiqueta--requerida" for="doc">Documento</label><input class="atomo-campo" id="doc" name="documento" type="text" pattern="[0-9]+" required></div>
  </div>
  <div class="molecula-grupo-botones molecula-grupo-botones--derecha organismo-formulario__pie"><button class="atomo-boton atomo-boton--primario" type="submit">Guardar</button></div>
</form>
