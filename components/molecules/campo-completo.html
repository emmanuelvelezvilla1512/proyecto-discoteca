<!-- MOLÉCULA · Campo con etiqueta, ayuda y error (el error solo se ve si el campo es inválido) -->
<div class="molecula-campo-completo">
  <label class="atomo-etiqueta atomo-etiqueta--requerida" for="correo">Correo electrónico</label><input class="atomo-campo" id="correo" name="correo" type="email" required>
  <p class="molecula-campo-completo__ayuda">Escribe tu correo.</p>
  <p class="molecula-campo-completo__error">Escribe un correo válido, con @.</p>
</div>
